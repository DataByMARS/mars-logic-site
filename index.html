<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>MARS — Website Maintenance</title>
  <meta
    name="description"
    content="The MARS website is currently undergoing maintenance."
  >
  <meta name="theme-color" content="#1e1853">

  <link rel="canonical" href="https://mars-logic.com/">
  <link rel="icon" href="assets/logo-icon.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --white: #ffffff;
      --martian-red: #a21e24;
      --stellar-grey: #676767;
      --deep-space: #1e1853;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 40px 24px;
      background:
        radial-gradient(
          circle at 84% 18%,
          rgba(30, 24, 83, 0.10),
          transparent 34%
        ),
        radial-gradient(
          circle at 14% 82%,
          rgba(162, 30, 36, 0.08),
          transparent 30%
        ),
        var(--white);
      font-family:
        "Poppins",
        system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;
      text-align: center;
    }

    main {
      width: min(760px, 100%);
    }

    h1 {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      color: var(--deep-space);
      font-size: clamp(2.6rem, 7vw, 5.75rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .logo {
      display: block;
      width: min(430px, 82vw);
      height: auto;
    }

    .rule {
      width: 72px;
      height: 4px;
      margin: 36px auto 28px;
      border: 0;
      border-radius: 999px;
      background: var(--martian-red);
    }

    .message {
      max-width: 660px;
      margin: 0 auto;
      color: var(--stellar-grey);
      font-size: clamp(1rem, 1.7vw, 1.2rem);
      line-height: 1.8;
    }

    .message a {
      color: var(--deep-space);
      font-weight: 700;
      text-decoration-color: rgba(162, 30, 36, 0.45);
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }

    .message a:hover,
    .message a:focus-visible {
      color: var(--martian-red);
    }

    .message a:focus-visible {
      outline: 2px solid var(--deep-space);
      outline-offset: 4px;
    }
  </style>
</head>

<body>
  <main>
    <h1>
      <span>Welcome to</span>
      <img
        class="logo"
        src="assets/logo.png"
        alt="MARS"
      >
    </h1>

    <hr class="rule">

    <p class="message">
      Our website is currently undergoing maintenance and should be back
      online shortly. For assistance, please contact
      <a href="mailto:dstone@mars-logic.com">dstone@mars-logic.com</a>.
    </p>
  </main>
</body>
</html>
