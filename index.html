<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>MARS — Website Maintenance</title>

  <meta
    name="description"
    content="The MARS website is currently undergoing maintenance."
  >

  <meta name="theme-color" content="#1e1853">

  <link rel="canonical" href="https://mars-logic.com/">
  <link rel="icon" href="assets/logo-icon.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --white: #ffffff;
      --martian-red: #a21e24;
      --stellar-grey: #676767;
      --deep-space: #1e1853;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100svh;
      margin: 0;
      padding: clamp(48px, 8vh, 90px) 28px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 88% 15%,
          rgba(30, 24, 83, 0.08),
          transparent 38%
        ),
        radial-gradient(
          circle at 10% 85%,
          rgba(162, 30, 36, 0.06),
          transparent 34%
        ),
        var(--white);

      color: var(--deep-space);
      font-family:
        "Poppins",
        system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;

      text-align: center;
    }

    main {
      width: min(980px, 100%);
      margin: 0 auto;
    }

    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .welcome-text {
      margin: 0 0 24px;

      color: var(--deep-space);
      font-size: clamp(2.5rem, 5vw, 4.6rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.045em;
    }

    .logo {
      display: block;
      width: clamp(250px, 30vw, 365px);
      max-width: 78vw;
      height: auto;
    }

    .rule {
      width: 76px;
      height: 4px;

      margin:
        clamp(52px, 7vh, 76px)
        auto
        clamp(40px, 5vh, 54px);

      border: 0;
      border-radius: 999px;
      background: var(--martian-red);
    }

    .message {
      width: min(860px, 100%);
      margin: 0 auto;

      color: var(--stellar-grey);
      font-size: clamp(1.05rem, 1.4vw, 1.2rem);
      font-weight: 400;
      line-height: 1.75;
      letter-spacing: -0.005em;
    }

    .message p {
      margin: 0;
    }

    .message p + p {
      margin-top: 14px;
    }

    .message a {
      display: inline-block;

      color: var(--deep-space);
      font-weight: 700;
      white-space: nowrap;

      text-decoration-color: rgba(162, 30, 36, 0.45);
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;

      transition:
        color 150ms ease,
        text-decoration-color 150ms ease;
    }

    .message a:hover {
      color: var(--martian-red);
      text-decoration-color: var(--martian-red);
    }

    .message a:focus-visible {
      color: var(--martian-red);
      outline: 2px solid var(--deep-space);
      outline-offset: 5px;
      border-radius: 2px;
    }

    @media (max-width: 600px) {
      body {
        padding: 64px 22px;
      }

      .welcome-text {
        margin-bottom: 20px;
      }

      .logo {
        width: min(290px, 78vw);
      }

      .rule {
        margin-top: 46px;
        margin-bottom: 36px;
      }

      .message {
        font-size: 1rem;
        line-height: 1.7;
      }

      .message p + p {
        margin-top: 18px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="welcome">
      <p class="welcome-text">Welcome to</p>

      <img
        class="logo"
        src="assets/logo.png"
        alt="MARS"
      >
    </div>

    <hr class="rule">

    <div class="message">
      <p>
        Our website is currently undergoing maintenance and should be
        back online shortly.
      </p>

      <p>
        For assistance, please contact
        <a href="mailto:dstone@mars-logic.com">dstone@mars-logic.com</a>.
      </p>
    </div>
  </main>
</body>
</html>
